<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3rror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js" defer></script>
<style>
  /* ---------- palette ---------- */
  :root {
    --bg: #0e0d16;
    --surface: rgba(255,255,255,.05);
    --surface-solid: #17161f;
    --border: rgba(255,255,255,.09);
    --text: #e9e7f2;
    --text-dim: #9b98ad;
    --accent: #a78bfa;
    --accent-2: #f0abfc;
    --user-text: #fff;
    --danger: #fb7185;
    --shadow: 0 10px 40px -12px rgba(0,0,0,.5);
    --a1: #7c3aed; --a2: #2563eb; --a3: #db2777;   /* aurora */
    --aurora-opacity: .42;
    --radius: 20px;
    --font: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="dawn"] {
    --bg: #f7f4f1;
    --surface: rgba(255,255,255,.62);
    --surface-solid: #fffdfb;
    --border: rgba(40,30,55,.10);
    --text: #2b2538;
    --text-dim: #77708a;
    --accent: #7c5cff;
    --accent-2: #d96bd0;
    --user-text: #fff;
    --shadow: 0 12px 40px -14px rgba(80,50,120,.28);
    --a1: #c4b5fd; --a2: #a5d8ff; --a3: #fbcfe8;
    --aurora-opacity: .55;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15.5px;
    line-height: 1.6;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- calm aurora background ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .aurora i {
    position: absolute; display: block;
    width: 62vmax; height: 62vmax; border-radius: 50%;
    filter: blur(95px); opacity: var(--aurora-opacity);
    mix-blend-mode: screen;
    animation: drift 40s ease-in-out infinite alternate;
    will-change: transform;
  }
  .aurora i:nth-child(1) { background: var(--a1); top: -22vmax; left: -12vmax; animation-duration: 44s; }
  .aurora i:nth-child(2) { background: var(--a2); bottom: -26vmax; right: -14vmax; animation-duration: 34s; animation-delay: -8s; }
  .aurora i:nth-child(3) { background: var(--a3); top: 24vmax; right: 8vmax; animation-duration: 52s; animation-delay: -16s; opacity: calc(var(--aurora-opacity) * .7); }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(7vmax,9vmax,0) scale(1.28); } }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }

  .wrap { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }

  .glass {
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(var(--bg), transparent);
  }
  .orb {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 34% 30%, #fff, var(--accent) 46%, var(--accent-2) 100%);
    box-shadow: 0 0 18px -2px var(--accent), 0 0 36px -10px var(--accent-2);
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); filter: brightness(1.12); } }
  body.thinking .orb { animation-duration: 1.5s; }

  .brand {
    font-weight: 700; font-size: 19px; letter-spacing: -.01em; margin-right: auto;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .icon-btn, .pill {
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .icon-btn:hover, .pill:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.96); }
  select.pill { padding-right: 30px; -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: right 14px center, right 9px center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  select.pill option { background: var(--surface-solid); color: var(--text); }

  /* settings popover */
  .settings-wrap { position: relative; }
  .panel {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
    width: 260px; padding: 14px; border-radius: 16px;
    background: var(--surface-solid); border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: none; flex-direction: column; gap: 12px;
  }
  .panel.open { display: flex; }
  .panel label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 5px; letter-spacing: .02em; }
  .panel select, .panel .row { width: 100%; }
  .panel select {
    font: inherit; font-size: 13px; width: 100%; padding: 8px 10px; border-radius: 10px;
    color: var(--text); background: var(--surface); border: 1px solid var(--border);
  }
  .panel select option { background: var(--surface-solid); }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; font: inherit; font-size: 12px; padding: 7px 4px; border-radius: 9px; cursor: pointer;
    color: var(--text-dim); background: var(--surface); border: 1px solid var(--border);
  }
  .seg button.on { color: var(--user-text); background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: transparent; }

  /* ---------- conversation ---------- */
  #scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #log { max-width: 760px; margin: 0 auto; padding: 26px 18px 12px; display: flex; flex-direction: column; gap: 16px; }

  .row { display: flex; animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 12px 16px; border-radius: 18px;
    overflow-wrap: anywhere;
  }
  .row.ai .bubble {
    background: var(--surface); border: 1px solid var(--border);
    backdrop-filter: blur(14px); border-bottom-left-radius: 6px;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--user-text); border-bottom-right-radius: 6px;
    box-shadow: 0 8px 24px -10px var(--accent);
  }
  .colwrap { display: flex; flex-direction: column; max-width: 82%; min-width: 0; }
  .colwrap .bubble { max-width: 100%; }

  .bubble :first-child { margin-top: 0; } .bubble :last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 10px; }
  .bubble pre { background: rgba(0,0,0,.28); border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; font-size: 13px; }
  :root[data-theme="dawn"] .bubble pre { background: rgba(40,30,55,.06); }
  .bubble code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
  .bubble :not(pre) > code { background: var(--surface); padding: 1px 6px; border-radius: 6px; }
  .bubble a { color: var(--accent); }

  .tools { display: flex; gap: 8px; margin: 6px 2px 0; opacity: 0; transition: opacity .15s; }
  .row.ai:hover .tools { opacity: 1; }
  .tools button { font: inherit; font-size: 12px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 2px 4px; }
  .tools button:hover { color: var(--accent); }

  .dots::after { content: "•••"; letter-spacing: 2px; animation: fade 1.3s ease-in-out infinite; color: var(--text-dim); }
  @keyframes fade { 50% { opacity: .3; } }
  .searching { color: var(--text-dim); font-size: 14px; }

  .sources { margin: 8px 2px 0; display: flex; flex-direction: column; gap: 3px; }
  .sources .shead { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 2px; }
  .sources a { font-size: 12.5px; color: var(--text-dim); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sources a:hover { color: var(--accent); }

  /* ---------- greeting ---------- */
  #greet { max-width: 620px; margin: 0 auto; padding: 16vh 22px 0; text-align: center; }
  #greet .g-orb {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 20px;
    background: radial-gradient(circle at 34% 30%, #fff, var(--accent) 46%, var(--accent-2) 100%);
    box-shadow: 0 0 44px -6px var(--accent), 0 0 80px -14px var(--accent-2);
    animation: breathe 4.5s ease-in-out infinite;
  }
  #greet h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  #greet p { color: var(--text-dim); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }
  .chips button {
    font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
    backdrop-filter: blur(14px); transition: border-color .15s, transform .1s;
  }
  .chips button:hover { border-color: var(--accent); }
  .chips button:active { transform: scale(.97); }

  /* ---------- composer ---------- */
  .composer { border-top: 1px solid var(--border); background: linear-gradient(transparent, var(--bg)); }
  form {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 14px 18px 18px;
  }
  .round {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, transform .1s;
  }
  .round svg { width: 19px; height: 19px; fill: currentColor; }
  .round:hover { color: var(--accent); border-color: var(--accent); }
  .round:active { transform: scale(.94); }
  .round.on { color: var(--user-text); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .round.rec { color: #fff; background: var(--danger); border-color: transparent; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 rgba(251,113,133,.5); } 50% { box-shadow: 0 0 0 8px rgba(251,113,133,0); } }
  .round.busy { opacity: .6; cursor: default; }
  .round.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.converse .round.mic { color: var(--user-text); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }

  .field { flex: 1; }
  textarea {
    width: 100%; resize: none; display: block;
    font: inherit; font-size: 15.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; padding: 11px 16px; max-height: 180px; outline: none;
    backdrop-filter: blur(14px);
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }
  .send {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--user-text); box-shadow: 0 6px 20px -6px var(--accent);
    transition: transform .1s, filter .15s;
  }
  .send svg { width: 18px; height: 18px; fill: currentColor; }
  .send:hover { filter: brightness(1.08); }
  .send:active { transform: scale(.94); }
  .send.stop { background: var(--danger); box-shadow: none; }
  .hint { text-align: center; font-size: 11.5px; color: var(--text-dim); padding-bottom: 12px; min-height: 14px; }
  .hint.warn { color: var(--danger); }

  @media (max-width: 560px) {
    .brand { font-size: 17px; }
    header { padding: 10px 12px; gap: 10px; }
    .pill { padding: 7px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>

  <div class="wrap">
    <header>
      <div class="orb"></div>
      <div class="brand">3rror</div>
      <select id="persona" class="pill" title="Personality"></select>
      <div class="settings-wrap">
        <button id="settingsBtn" class="icon-btn" title="Settings">Settings</button>
        <div id="settings" class="panel">
          <div>
            <label>Model</label>
            <select id="model"></select>
          </div>
          <div>
            <label>Voice</label>
            <select id="voice"></select>
          </div>
          <div>
            <label>Appearance</label>
            <div class="seg" id="themeSeg">
              <button data-theme="nebula">Nebula</button>
              <button data-theme="dawn">Dawn</button>
            </div>
          </div>
          <div>
            <label>Interface sounds</label>
            <div class="seg" id="soundSeg">
              <button data-sound="on">On</button>
              <button data-sound="off">Off</button>
            </div>
          </div>
        </div>
      </div>
      <button id="clear" class="icon-btn">New</button>
    </header>

    <div id="scroll">
      <div id="greet"></div>
      <div id="log" hidden></div>
    </div>

    <div class="composer">
      <form id="form">
        <button type="button" id="net" class="round" title="Search the web">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20Zm6.9 6h-2.5a15.7 15.7 0 00-1.4-3.3A8 8 0 0118.9 8ZM12 4c.8 1.1 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.9 1.9-4ZM4.3 14a8 8 0 010-4h2.9a17.6 17.6 0 000 4H4.3Zm.8 2h2.5c.3 1.2.8 2.3 1.4 3.3A8 8 0 015.1 16ZM7.6 8H5.1a8 8 0 013.9-3.3C8.4 5.7 7.9 6.8 7.6 8ZM12 20c-.8-1.1-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.9-1.9 4Zm2.3-6H9.7a15.3 15.3 0 010-4h4.6a15.3 15.3 0 010 4Zm.7 5.3c.6-1 1.1-2.1 1.4-3.3h2.5a8 8 0 01-3.9 3.3ZM16.8 14a17.6 17.6 0 000-4h2.9a8 8 0 010 4h-2.9Z"/></svg>
        </button>
        <button type="button" id="speak" class="round" title="Speak replies aloud">
          <svg viewBox="0 0 24 24"><path d="M13 4 8 8H4v8h4l5 4V4Zm4.5 3.5a6 6 0 010 9l-1.4-1.4a4 4 0 000-6.2l1.4-1.4Z"/></svg>
        </button>
        <button type="button" id="mic" class="round mic" title="Speak">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3Zm5-3a1 1 0 112 0 7 7 0 01-6 6.92V21a1 1 0 11-2 0v-3.08A7 7 0 015 11a1 1 0 112 0 5 5 0 0010 0Z"/></svg>
        </button>
        <div class="field">
          <textarea id="input" rows="1" placeholder="Message 3rror…" autofocus></textarea>
        </div>
        <button type="submit" id="send" class="send" title="Send">
          <svg viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2.5-7.5L3 11Z"/></svg>
        </button>
      </form>
      <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), greet = $("greet"), scroll = $("scroll");
  const form = $("form"), input = $("input"), sendBtn = $("send");
  const modelSel = $("model"), personaSel = $("persona"), voiceSel = $("voice");
  const netBtn = $("net"), speakBtn = $("speak"), micBtn = $("mic"), clearBtn = $("clear");
  const settingsBtn = $("settingsBtn"), settings = $("settings");
  const themeSeg = $("themeSeg"), soundSeg = $("soundSeg"), hint = $("hint");
  const HINT_DEFAULT = hint.textContent;

  const store = {
    get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let history = store.get("chat.history", []);
  let controller = null;
  let muted = store.get("chat.muted", false);
  let netMode = store.get("chat.net", false);
  let speakMode = store.get("chat.speak", false);
  let conversing = false;

  const setHint = (t, warn) => { hint.textContent = t; hint.classList.toggle("warn", !!warn); };
  const resetHint = () => setHint(HINT_DEFAULT, false);

  /* ---------- settings popover ---------- */
  settingsBtn.onclick = (e) => { e.stopPropagation(); settings.classList.toggle("open"); };
  document.addEventListener("click", (e) => {
    if (!settings.contains(e.target) && e.target !== settingsBtn) settings.classList.remove("open");
  });

  /* ---------- gentle sound ---------- */
  let actx = null;
  function blip(freq = 520, dur = 0.09, gain = 0.025) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq; g.gain.value = gain;
      o.connect(g); g.connect(actx.destination);
      const s = actx.currentTime;
      g.gain.setValueAtTime(gain, s);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.start(s); o.stop(s + dur);
    } catch {}
  }
  function refreshSound() {
    soundSeg.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", (b.dataset.sound === "on") !== muted));
  }
  soundSeg.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    muted = b.dataset.sound === "off"; store.set("chat.muted", muted);
    refreshSound(); if (!muted) blip(620, .07);
  };
  refreshSound();

  /* ---------- theme ---------- */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    store.set("chat.theme", t);
    themeSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
  }
  applyTheme(store.get("chat.theme", "nebula"));
  themeSeg.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    applyTheme(b.dataset.theme); blip(500, .06);
  };

  /* ---------- web + speak toggles ---------- */
  function refreshToggles() {
    netBtn.classList.toggle("on", netMode);
    speakBtn.classList.toggle("on", speakMode);
  }
  netBtn.onclick = () => { netMode = !netMode; store.set("chat.net", netMode); refreshToggles(); blip(netMode ? 640 : 440, .06); };
  speakBtn.onclick = () => {
    speakMode = !speakMode; store.set("chat.speak", speakMode); refreshToggles();
    blip(speakMode ? 640 : 440, .06);
    if (!speakMode) stopSpeaking();
    else if (!spokenOnce) { spokenOnce = true; }   // priming handled on first real reply
  };
  refreshToggles();

  /* ---------- speech synthesis — modern, calm voice ---------- */
  const synth = window.speechSynthesis;
  let voices = [], spokenOnce = false;
  // higher score = more natural / modern sounding
  function voiceScore(v) {
    let s = 0;
    if (!v.localService) s += 5;                       // network / neural voices
    if (/natural|neural|online|premium|enhanced/i.test(v.name)) s += 6;
    if (/aria|jenny|guy|ava|emma|andrew|libby|sonia|nova|blessica|clara/i.test(v.name)) s += 3;
    if (/^en-US/i.test(v.lang)) s += 2;
    else if (/^en-GB/i.test(v.lang)) s += 1;
    if (/microsoft/i.test(v.name)) s += 1;
    if (/google/i.test(v.name)) s += 2;
    if (/zira|david|mark|hazel/i.test(v.name)) s -= 2;  // the old robotic ones
    return s;
  }
  function loadVoices() {
    if (!synth) return;
    const all = synth.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
    if (!all.length) return;
    voices = all.sort((a, b) => voiceScore(b) - voiceScore(a));
    const saved = store.get("chat.voice", "");
    voiceSel.innerHTML = "";
    voices.forEach(v => {
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = v.name.replace(/Microsoft |Google |Online |\(Natural\)/gi, "").trim() +
                      (/^en-GB/i.test(v.lang) ? " · UK" : "");
      voiceSel.append(o);
    });
    voiceSel.value = voices.some(v => v.voiceURI === saved) ? saved : voices[0].voiceURI;
  }
  function currentVoice() {
    return voices.find(v => v.voiceURI === voiceSel.value) || voices[0] || null;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  voiceSel.onchange = () => {
    store.set("chat.voice", voiceSel.value);
    const v = currentVoice();
    if (v && synth) { synth.cancel(); const u = new SpeechSynthesisUtterance("Hi, I'm 3rror."); u.voice = v; u.rate = 1; u.pitch = 1; synth.speak(u); }
  };

  function speakText(text) {
    if (!synth || !speakMode || !text) return;
    stopSpeaking();
    const clean = text
      .replace(/```[\s\S]*?```/g, ". ")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/^\s*[-*+]\s+/gm, "")
      .replace(/^\s*#{1,6}\s+/gm, "")
      .replace(/[*_#>`|~]/g, "")
      .replace(/【[^】]*】/g, "")
      .replace(/\[\d+\]/g, "")
      .replace(/\s+/g, " ")
      .trim();
    if (!clean) return;
    // break into sentences so it starts speaking sooner and sounds natural
    const parts = clean.match(/[^.!?]+[.!?]?/g) || [clean];
    const v = currentVoice();
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.trim());
      if (v) u.voice = v;
      u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
      if (i === parts.length - 1) u.onend = () => { if (conversing) startRec(); };
      synth.speak(u);
    });
  }
  function stopSpeaking() { try { synth && synth.cancel(); } catch {} }

  /* ---------- markdown ---------- */
  function mdReady(cb) {
    if (window.marked && window.DOMPurify) return cb();
    const t = setInterval(() => { if (window.marked && window.DOMPurify) { clearInterval(t); cb(); } }, 50);
    setTimeout(() => clearInterval(t), 4000);
  }
  function render(el, text) {
    // normalise odd model citation syntax like 【1†L2-L4】 -> [1]
    text = text.replace(/【\s*(\d+)[^】]*】/g, "[$1]").replace(/\[(\d+)[†‡][^\]]*\]/g, "[$1]");
    if (window.marked && window.DOMPurify) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
      el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    } else { el.textContent = text; }
  }

  /* ---------- message rows ---------- */
  function addRow(role, text) {
    greet.hidden = true; log.hidden = false;
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "ai");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") { bubble.textContent = text; row.append(bubble); }
    else {
      render(bubble, text || "");
      const wrap = document.createElement("div");
      wrap.className = "colwrap";
      const tools = document.createElement("div");
      tools.className = "tools";
      const copy = document.createElement("button");
      copy.textContent = "Copy";
      copy.onclick = () => {
        navigator.clipboard.writeText(bubble.dataset.raw || bubble.textContent);
        copy.textContent = "Copied"; blip(640, .05);
        setTimeout(() => (copy.textContent = "Copy"), 1200);
      };
      const say = document.createElement("button");
      say.textContent = "Read aloud";
      say.onclick = () => { speakMode = true; store.set("chat.speak", true); refreshToggles(); stopSpeaking(); speakText(bubble.dataset.raw || bubble.textContent); };
      tools.append(copy, say);
      wrap.append(bubble, tools);
      row.append(wrap);
    }
    log.append(row);
    scroll.scrollTop = scroll.scrollHeight;
    return bubble;
  }

  function repaint() {
    log.innerHTML = "";
    if (!history.length) { greet.hidden = false; log.hidden = true; return; }
    greet.hidden = true; log.hidden = false;
    for (const m of history) {
      const el = addRow(m.role, m.content);
      if (m.role !== "user") el.dataset.raw = m.content;
    }
  }

  /* ---------- greeting ---------- */
  function showGreeting() {
    greet.innerHTML = `
      <div class="g-orb"></div>
      <h1>Hi, I'm 3rror.</h1>
      <p>Ask me anything. This chat stays on your device.</p>
      <div class="chips">
        <button>Explain something simply</button>
        <button>Help me brainstorm names</button>
        <button>Draft a friendly email</button>
        <button>What can you do?</button>
      </div>`;
    greet.querySelectorAll(".chips button").forEach(b => {
      b.onclick = () => { input.value = b.textContent; autosize(); input.focus(); blip(560, .05); };
    });
  }

  /* ---------- voice input ---------- */
  let recorder = null, chunks = [], recStream = null;
  async function startRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setHint("voice input isn't supported in this browser", true); setTimeout(resetHint, 2500); return;
    }
    try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { setHint("microphone permission denied", true); setTimeout(resetHint, 2500); exitConverse(); return; }
    chunks = [];
    recorder = new MediaRecorder(recStream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = sendClip;
    recorder.start();
    micBtn.classList.add("rec");
    setHint("listening… click the mic to stop");
    blip(720, .05);
  }
  function stopRec() {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    if (recStream) recStream.getTracks().forEach(t => t.stop());
    micBtn.classList.remove("rec");
  }
  async function sendClip() {
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    if (blob.size < 1200) { resetHint(); exitConverse(); return; }
    micBtn.classList.add("busy");
    setHint("transcribing…");
    try {
      const fd = new FormData();
      fd.append("audio", blob, "clip.webm");
      const res = await fetch("/transcribe", { method: "POST", body: fd });
      const data = await res.json();
      if (data.text) {
        input.value = (input.value ? input.value.trim() + " " : "") + data.text;
        autosize(); blip(760, .05); resetHint();
        if (conversing) { micBtn.classList.remove("busy"); form.requestSubmit(); return; }
        input.focus();
      } else { setHint(data.error || "couldn't hear that", true); exitConverse(); }
    } catch { setHint("transcription failed", true); exitConverse(); }
    finally { micBtn.classList.remove("busy"); setTimeout(resetHint, 2000); }
  }
  function exitConverse() { conversing = false; document.body.classList.remove("converse"); stopSpeaking(); }
  micBtn.onclick = () => {
    if (micBtn.classList.contains("busy")) return;
    if (micBtn.classList.contains("rec")) { stopRec(); return; }
    if (speakMode) { conversing = true; document.body.classList.add("converse"); }
    startRec();
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { exitConverse(); stopRec(); stopSpeaking(); }
  });

  /* ---------- composer ---------- */
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  clearBtn.onclick = () => {
    if (controller) controller.abort();
    exitConverse();
    history = []; store.set("chat.history", history);
    repaint(); showGreeting(); input.focus(); blip(460, .07);
  };

  function setStreaming(on) {
    document.body.classList.toggle("thinking", on);
    sendBtn.classList.toggle("stop", on);
    sendBtn.innerHTML = on
      ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2.5-7.5L3 11Z"/></svg>';
    if (!on) controller = null;
  }

  function addSources(afterEl, list) {
    if (!list || !list.length) return;
    const box = document.createElement("div");
    box.className = "sources";
    box.innerHTML = "<div class='shead'>Sources</div>";
    list.forEach((s, i) => {
      const a = document.createElement("a");
      a.href = s.u; a.target = "_blank"; a.rel = "noopener";
      a.textContent = `${i + 1}. ${s.t || s.u}`;
      box.append(a);
    });
    afterEl.append(box);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (controller) { controller.abort(); exitConverse(); return; }
    const text = input.value.trim();
    if (!text) return;
    stopSpeaking(); blip(560, .05);

    addRow("user", text);
    history.push({ role: "user", content: text });
    store.set("chat.history", history);
    input.value = ""; autosize();

    const bubble = addRow("assistant", "");
    const wrap = bubble.parentElement;
    bubble.innerHTML = netMode
      ? "<span class='searching'>Searching the web…</span>"
      : "<span class='dots'></span>";
    let reply = "";
    controller = new AbortController();
    setStreaming(true);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, model: modelSel.value, persona: personaSel.value, search: netMode }),
        signal: controller.signal,
      });
      if (res.status === 429) { reply = "_You're sending messages too fast — wait a minute._"; throw new Error("handled"); }
      let sources = [];
      try { sources = JSON.parse(res.headers.get("X-Sources") || "[]"); } catch {}
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let first = true;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (first) { first = false; bubble.innerHTML = ""; blip(760, .04); }
        reply += decoder.decode(value, { stream: true });
        bubble.dataset.raw = reply;
        render(bubble, reply);
        scroll.scrollTop = scroll.scrollHeight;
      }
      bubble._sources = sources;
    } catch (err) {
      if (err.name === "AbortError" || err.message === "handled") {}
      else reply += "\n\n_Couldn't reach the server._";
    } finally {
      render(bubble, reply || "_No response._");
      bubble.dataset.raw = reply;
      if (bubble._sources) addSources(wrap, bubble._sources);
      history.push({ role: "assistant", content: reply });
      store.set("chat.history", history);
      setStreaming(false);
      speakText(reply);
      if (!conversing) input.focus();
    }
  });

  /* ---------- config ---------- */
  fetch("/config").then(r => r.json()).then(({ models, default: def, personas, search }) => {
    if (search === false) { netBtn.hidden = true; netMode = false; refreshToggles(); }
    const savedM = store.get("chat.model", def);
    modelSel.innerHTML = "";
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m; o.textContent = m.replace(/^.*\//, "");
      modelSel.append(o);
    }
    modelSel.value = models.includes(savedM) ? savedM : def;

    const savedP = store.get("chat.persona", personas[0].id);
    personaSel.innerHTML = "";
    for (const p of personas) {
      const o = document.createElement("option");
      o.value = p.id; o.textContent = p.label;
      personaSel.append(o);
    }
    personaSel.value = personas.some(p => p.id === savedP) ? savedP : personas[0].id;
  }).catch(() => {
    modelSel.innerHTML = "<option>gpt-oss-120b</option>";
    personaSel.innerHTML = "<option value='assistant'>Assistant</option>";
  });
  modelSel.onchange = () => { store.set("chat.model", modelSel.value); blip(540, .04); };
  personaSel.onchange = () => { store.set("chat.persona", personaSel.value); blip(540, .04); };

  /* ---------- start ---------- */
  repaint();
  mdReady(repaint);
  if (!history.length) showGreeting();
})();
</script>
</body>
</html>
